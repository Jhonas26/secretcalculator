
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculator</title>

<!-- APP CONFIGURATION -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
}

.calculator {
  width: 100%;
  max-width: 390px;
  padding: 25px;
}

.display {
  height: 180px;
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  font-size: 75px;
  font-weight: 300;
  overflow: hidden;
  padding-bottom: 20px;
  white-space: nowrap;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

button {
  border: none;
  aspect-ratio: 1;
  border-radius: 50%;
  font-size: 30px;
  color: white;
  background: #333;
  cursor: pointer;
  transition: 0.15s;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  filter: brightness(1.5);
  transform: scale(0.94);
}

.gray {
  background: #a5a5a5;
  color: black;
}

.orange {
  background: #ff9f0a;
}

.orange.selected {
  background: white;
  color: #ff9f0a;
}

.zero {
  grid-column: span 2;
  aspect-ratio: auto;
  border-radius: 100px;
  text-align: left;
  padding-left: 30px;
}

/* SECRET ANIMATION */

.secret {
  font-size: 35px !important;
  color: #ff9fba;
  animation: appear 0.7s ease;
}

@keyframes appear {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }

  60% {
    transform: scale(1.08);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<div class="calculator">

  <div class="display" id="display">0</div>

  <div class="buttons">

    <button class="gray" onclick="clearAll()">AC</button>
    <button class="gray" onclick="toggleSign()">+/-</button>
    <button class="gray" onclick="percent()">%</button>
    <button class="orange" onclick="setOperator('÷',this)">÷</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="orange" onclick="setOperator('×',this)">×</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="orange" onclick="setOperator('-',this)">−</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button class="orange" onclick="setOperator('+',this)">+</button>

    <button class="zero" onclick="number('0')">0</button>
    <button onclick="decimal()">.</button>
    <button class="orange" onclick="calculate()">=</button>

  </div>
</div>

<script>

let current = "0";
let previous = null;
let operation = null;
let resetScreen = false;
let secretShown = false;

const display = document.getElementById("display");

function update() {
  display.classList.remove("secret");

  if (current === "Error") {
    display.textContent = "Error";
  } else {
    let value = Number(current);

    display.textContent = current.endsWith(".")
      ? value.toLocaleString("en-US") + "."
      : value.toLocaleString("en-US", {
          maximumFractionDigits: 8
        });
  }

  let length = display.textContent.length;

  display.style.fontSize =
    length > 12 ? "35px" :
    length > 9 ? "48px" : "75px";
}

function number(num) {
  if (secretShown || current === "Error") {
    clearAll();
  }

  if (resetScreen) {
    current = num;
    resetScreen = false;

    document.querySelectorAll(".orange")
      .forEach(b => b.classList.remove("selected"));

  } else {
    if (current.replace(/[^0-9]/g, "").length >= 12) return;

    current = current === "0" ? num : current + num;
  }

  update();
}

function decimal() {
  if (secretShown || current === "Error") clearAll();

  if (resetScreen) {
    current = "0";
    resetScreen = false;
  }

  if (!current.includes(".")) {
    current += ".";
  }

  update();
}

function clearAll() {
  current = "0";
  previous = null;
  operation = null;
  resetScreen = false;
  secretShown = false;

  display.classList.remove("secret");

  document.querySelectorAll(".orange")
    .forEach(b => b.classList.remove("selected"));

  update();
}

function toggleSign() {
  if (secretShown || current === "Error") return;

  if (current !== "0") {
    current = String(-Number(current));
    update();
  }
}

function percent() {
  if (secretShown || current === "Error") return;

  current = String(Number(current) / 100);
  update();
}

function setOperator(op, btn) {
  if (secretShown || current === "Error") return;

  if (operation && !resetScreen) {
    calculate();

    if (secretShown || current === "Error") return;
  }

  previous = Number(current);
  operation = op;
  resetScreen = true;

  document.querySelectorAll(".orange")
    .forEach(b => b.classList.remove("selected"));

  btn.classList.add("selected");
}

function showSecret(message) {
  secretShown = true;

  display.textContent = message;
  display.classList.remove("secret");

  void display.offsetWidth;

  display.classList.add("secret");

  previous = null;
  operation = null;
  resetScreen = true;

  document.querySelectorAll(".orange")
    .forEach(b => b.classList.remove("selected"));
}

function calculate() {
  if (secretShown || operation === null || previous === null) return;

  let second = Number(current);

  // SECRET CODE 1 ❤️

  if (previous === 14 && operation === "+" && second === 3) {
    showSecret("i love youu❤️");
    return;
  }

  // SECRET CODE 2 ❤️

  if (previous === 140 && operation === "+" && second === 3) {
    showSecret("i miss youu❤️");
    return;
  }

  // NORMAL CALCULATOR

  let result;

  switch (operation) {
    case "+":
      result = previous + second;
      break;

    case "-":
      result = previous - second;
      break;

    case "×":
      result = previous * second;
      break;

    case "÷":
      result = second === 0 ? NaN : previous / second;
      break;
  }

  current = Number.isFinite(result)
    ? String(Number(result.toPrecision(12)))
    : "Error";

  previous = null;
  operation = null;
  resetScreen = true;

  document.querySelectorAll(".orange")
    .forEach(b => b.classList.remove("selected"));

  update();
}

update();

/* SERVICE WORKER REGISTRATION */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => {
        console.log("Service worker:", error);
      });
  });
}

</script>

</body>
</html>
